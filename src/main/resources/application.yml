spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTHENTICATE:true}
          starttls:
            enable: ${SMTP_ENABLE_TLS:true}
            required: ${SMTP_REQUIRE_TLS:true}
          ssl:
            trust: ${SMTP_TRUSTED_HOSTS}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  base-url: ${APP_BASE_URL}
  admin-url: ${APP_ADMIN_URL}
  admin:
    email: ${APP_ADMIN_EMAIL}

logging:
  level:
    org.ua.drmp.chat.websocket: DEBUG
    org.ua.drmp.chat: DEBUG
    org.springframework.web.socket: DEBUG